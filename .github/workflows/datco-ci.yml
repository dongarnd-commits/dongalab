name: DATCO CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:1/unused
      BIZINFO_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --frozen --project apps/api
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Synthetic inventory and comparator unit tests
        working-directory: apps/api
        run: uv run --frozen pytest tests/test_dmp_inventory.py tests/test_capability_comparison.py tests/test_proposal_documents.py -v --junitxml=unit.xml
  integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: datco_ci_admin
          POSTGRES_USER: ci_provisioner
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_provisioner -d datco_ci_admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATCO_CI_ADMIN_URL: postgresql+psycopg://ci_provisioner:ephemeral-ci-only@127.0.0.1:5432/datco_ci_admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --frozen --project apps/api
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Migration, Notice, lineage, matching, P1 and authorization
        working-directory: apps/api
        run: uv run --frozen python tests/ci_run.py integration
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:1/unused
      BIZINFO_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --frozen --project apps/api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: API type equality
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: uv run --frozen python tests/verify_api_types.py ../../storage/private/runtime/ci-types
      - run: npm run lint --prefix apps/web
      - run: npm run build --prefix apps/web
  playwright:
    name: Playwright Public E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: datco_ci_admin
          POSTGRES_USER: ci_provisioner
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_provisioner -d datco_ci_admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATCO_CI_ADMIN_URL: postgresql+psycopg://ci_provisioner:ephemeral-ci-only@127.0.0.1:5432/datco_ci_admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --frozen --project apps/api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Real Web, API, Worker and PostgreSQL
        working-directory: apps/api
        run: uv run --frozen python tests/ci_run.py e2e
